name: Oracle Instance Creator
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  create-instance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create OCI config
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          echo "$OCI_PRIVATE_KEY" > oci_api_private_key.pem
          chmod 600 oci_api_private_key.pem
          mkdir -p ~/.oci
          {
            echo "[DEFAULT]"
            echo "user=$OCI_USER"
            echo "fingerprint=$OCI_FINGERPRINT"
            echo "tenancy=$OCI_TENANCY"
            echo "region=$OCI_REGION"
            echo "key_file=/home/runner/work/oracle-freetier-instance-creation/oracle-freetier-instance-creation/oci_api_private_key.pem"
          } > ~/.oci/config
          cat ~/.oci/config

      - name: Create oci.env
        env:
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          {
            echo "OCI_COMPARTMENT_ID=$OCI_TENANCY"
            echo "OCI_IMAGE_ID=$OCI_IMAGE_ID"
            echo "OCI_SUBNET_ID=$OCI_SUBNET_ID"
            echo "OCI_SSH_PUBLIC_KEY=$OCI_SSH_PUBLIC_KEY"
            echo "OCI_INSTANCE_SHAPE=VM.Standard.A1.Flex"
            echo "OCI_OCPUS=2"
            echo "OCI_MEMORY_IN_GBS=12"
            echo "OCI_AVAILABILITY_DOMAIN=SA-SANTIAGO-1-AD-1"
            echo "OCI_INSTANCE_DISPLAY_NAME=minecraft-server"
            echo "OCI_ASSIGN_PUBLIC_IP=true"
          } > oci.env

      - name: Run instance creator
        run: python main.py
