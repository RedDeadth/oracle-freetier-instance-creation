name: Oracle Instance Creator
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  create-instance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create OCI config
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          echo "$OCI_PRIVATE_KEY" > oci_api_private_key.pem
          chmod 600 oci_api_private_key.pem
          mkdir -p ~/.oci
          printf "[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=%s\nkey_file=/home/runner/work/oracle-freetier-instance-creation/oracle-freetier-instance-creation/oci_api_private_key.pem\n" "$OCI_USER" "$OCI_FINGERPRINT" "$OCI_TENANCY" "$OCI_REGION" > ~/.oci/config

      - name: Create oci.env
        env:
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          printf "OCI_COMPARTMENT_ID=%s\nOCI_IMAGE_ID=%s\nOCI_SUBNET_ID=%s\nOCI_SSH_PUBLIC_KEY=%s\nOCI_INSTANCE_SHAPE=VM.Standard.A1.Flex\nOCI_OCPUS=2\nOCI_MEMORY_IN_GBS=12\nOCI_AVAILABILITY_DOMAIN=SA-SANTIAGO-1-AD-1\nOCI_INSTANCE_DISPLAY_NAME=minecraft-server\nOCI_ASSIGN_PUBLIC_IP=true\n" "$OCI_TENANCY" "$OCI_IMAGE_ID" "$OCI_SUBNET_ID" "$OCI_SSH_PUBLIC_KEY" > oci.env

      - name: Run instance creator
        run: python main.py
